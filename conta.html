<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Conta - MTA DAYZ | Last Point</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="conta.css">
    <link rel="stylesheet" href="auth-modal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="navbar-esquerda">
            <a href="index.html"><i class="fa-solid fa-house"></i><span>Início</span></a>
            <a href="loja.html"><i class="fa-solid fa-store"></i><span>Loja</span></a>
            <a href="regras.html"><i class="fa-solid fa-scroll"></i><span>Regras</span></a>
            <a href="ajuda.html"><i class="fa-solid fa-circle-question"></i><span>Ajuda</span></a>
        </div>
        <img class="navbar-logo" src="assets/logo.png" alt="Last Point - Logo">
        <div class="navbar-direita" id="nav-user-area">
            <!-- Preenchido via JavaScript -->
        </div>
    </nav>

    <main class="pagina-conta">
        <section class="cabecalho-conta">
            <div class="card-usuario-perfil">
                <div class="avatar-usuario">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <div class="info-usuario">
                    <span class="etiqueta-status"><i class="fa-solid fa-circle"></i> Conta Verificada</span>
                    <h1 id="nome-usuario-display">Carregando...</h1>
                    <p>Membro desde: <span id="data-criacao-display">--/--/----</span></p>
                </div>
                <button class="botao-sair" onclick="fazerLogout()">
                    <i class="fa-solid fa-right-from-bracket"></i> Sair da Conta
                </button>
            </div>
        </section>

        <section class="secao-inventario">
            <div class="cabecalho-secao">
                <h2><i class="fa-solid fa-boxes-stacked"></i> Meu Inventário & Benefícios</h2>
                <p>Veja abaixo todos os pacotes, VIPs e moedas adquiridas para sua conta no MTA.</p>
            </div>

            <div class="grade-inventario" id="grid-inventario">
                <!-- Itens injetados via JS -->
            </div>
        </section>
    </main>

    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            carregarDadosConta();
        });
    </script>
    <script src="auth.js"></script>

    <!-- Botão Fixo de Acesso ao Carrinho -->
<button class="botao-carrinho-fixo" id="abrirCarrinho">
    <i class="fa-solid fa-cart-shopping"></i>
    <span class="carrinho-badge" id="carrinhoQtd">0</span>
</button>

<!-- Drawer / Aba Lateral do Carrinho -->
<div class="carrinho-drawer-overlay" id="carrinhoOverlay"></div>
<aside class="carrinho-drawer" id="carrinhoDrawer">
    <div class="carrinho-cabecalho">
        <h2><i class="fa-solid fa-cart-shopping"></i> Meu Carrinho</h2>
        <button class="fechar-drawer" id="fecharCarrinho">&times;</button>
    </div>
    <div class="carrinho-conteudo" id="carrinhoItens">
        <p class="carrinho-vazio">Seu carrinho está vazio.</p>
    </div>
    <div class="carrinho-rodape">
        <div class="carrinho-total">
            <span>Total:</span>
            <strong id="carrinhoTotal">R$ 0,00</strong>
        </div>
        <button class="botao-finalizar" id="btnFinalizarCompra">Finalizar Compra</button>
    </div>
</aside>

<!-- Modal de Login Re-estilizado -->
<div class="modal-auth-overlay" id="authModalOverlay">
    <div class="modal-auth">
        <button class="fechar-modal" id="fecharAuthModal">&times;</button>
        <div class="auth-cabecalho">
            <i class="fa-solid fa-shield-halved"></i>
            <h2>Área do Jogador</h2>
            <p>Entre na sua conta para continuar</p>
        </div>
        <form id="formLogin" class="form-auth">
            <div class="campo-grupo">
                <label for="inputUsuario">Usuário</label>
                <div class="input-com-icone">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="inputUsuario" placeholder="Digite seu usuário" required>
                </div>
            </div>
            <div class="campo-grupo">
                <label for="inputSenha">Senha</label>
                <div class="input-com-icone">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="inputSenha" placeholder="Digite sua senha" required>
                </div>
            </div>
            <div id="mensagemErro" class="mensagem-erro"></div>
            <button type="submit" class="botao-submit-auth">
                <i class="fa-solid fa-right-to-bracket"></i> Entrar
            </button>
        </form>
    </div>
</div>
</body>
</html>
