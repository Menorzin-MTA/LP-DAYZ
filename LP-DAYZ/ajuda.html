    <script>
        // ==========================================
        // FUNÇÃO PARA ABRIR/FECHAR DÚVIDAS
        // ==========================================

        function toggleDuvida(elemento) {
            const item = elemento.parentElement;
            const resposta = item.querySelector('.duvida-resposta');
            const icone = elemento.querySelector('.icone-toggle');

            const estaAberto = item.classList.contains('aberto');

            if (estaAberto) {
                item.classList.remove('aberto');
                resposta.style.maxHeight = '0';
                resposta.style.padding = '0 20px';
                icone.className = 'fa-solid fa-plus icone-toggle';
            } else {
                item.classList.add('aberto');
                resposta.style.maxHeight = resposta.scrollHeight + 'px';
                resposta.style.padding = '15px 20px';
                icone.className = 'fa-solid fa-minus icone-toggle';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.item-duvida').forEach(item => {
                const resposta = item.querySelector('.duvida-resposta');
                const icone = item.querySelector('.icone-toggle');
                item.classList.remove('aberto');
                resposta.style.maxHeight = '0';
                resposta.style.padding = '0 20px';
                icone.className = 'fa-solid fa-plus icone-toggle';
            });
        });
    </script>
